# Cloudflare Workers Static Assets + Function config.
#
# - Static files in this directory are served as the dashboard / news / etc.
# - worker.js is loaded as the Worker entry point. It handles /api/* routes
#   server-side (no CORS limits), and delegates everything else to the static
#   asset bundle via env.ASSETS.fetch().
#
# Deploy with:  npx wrangler deploy

name = "isitkickingoff"
main = "worker.js"
compatibility_date = "2026-04-27"

[assets]
directory = "./"
binding = "ASSETS"
not_found_handling = "404-page"
