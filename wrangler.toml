# Cloudflare config for isitkickingoff.
#
# - Static files in this directory are served as the dashboard / news / etc.
# - _worker.js is auto-detected by Cloudflare Pages as the project Worker
#   (the leading underscore is the Pages convention — Pages serves it as the
#   request handler, not as a static asset).
# - For Workers Static Assets deploys, main = "_worker.js" is also explicit
#   so wrangler picks it up the same way.
#
# Either way, _worker.js handles /api/* routes server-side (no CORS limits)
# and delegates everything else to the static asset bundle.
#
# Deploy:
#   - Cloudflare Pages with GitHub integration: just push, Pages picks up
#     _worker.js automatically.
#   - Workers via wrangler: npx wrangler deploy

name = "isitkickingoff"
main = "_worker.js"
compatibility_date = "2026-04-27"

[assets]
directory = "./"
binding = "ASSETS"
not_found_handling = "404-page"
