<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <clipPath id="circle-crop2">
      <circle cx="500" cy="500" r="500"/>
    </clipPath>
    <radialGradient id="vignette" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.55)"/>
    </radialGradient>
  </defs>

  <!-- Full Union Jack -->
  <g clip-path="url(#circle-crop2)">
    <rect width="1000" height="1000" fill="#012169"/>
    <path d="M0,0 L1000,1000 M1000,0 L0,1000" stroke="#fff" stroke-width="180"/>
    <clipPath id="quadrant2">
      <path d="M500,500 L1000,500 L1000,1000 L500,1000 Z M500,500 L0,500 L0,0 L500,0 Z"/>
    </clipPath>
    <path d="M0,0 L1000,1000 M1000,0 L0,1000" clip-path="url(#quadrant2)" stroke="#C8102E" stroke-width="100"/>
    <path d="M500,0 v1000 M0,500 h1000" stroke="#fff" stroke-width="280"/>
    <path d="M500,0 v1000 M0,500 h1000" stroke="#C8102E" stroke-width="180"/>
    <rect width="1000" height="1000" fill="url(#vignette)"/>
  </g>

  <!-- Big disc behind the pint to give it a focal point -->
  <circle cx="500" cy="490" r="280" fill="rgba(7,9,12,0.78)" stroke="#ff8a1f" stroke-width="6"/>

  <!-- Hero emoji: the pint -->
  <text x="500" y="595" font-size="380" text-anchor="middle" font-family="Apple Color Emoji, Noto Color Emoji, Segoe UI Emoji, EmojiOne Color, sans-serif">🍺</text>

  <!-- Outer brand ring -->
  <circle cx="500" cy="500" r="492" fill="none" stroke="#0d1117" stroke-width="12"/>
  <circle cx="500" cy="500" r="478" fill="none" stroke="#ff8a1f" stroke-width="4" opacity="0.7"/>
</svg>
