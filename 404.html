<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Lost the plot · Is It Kicking Off?</title>
<meta name="theme-color" content="#07090c" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 30'%3E%3CclipPath id='t'%3E%3Cpath d='M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z'/%3E%3C/clipPath%3E%3Cpath d='M0,0 v30 h60 v-30 z' fill='%23012169'/%3E%3Cpath d='M0,0 L60,30 M60,0 L0,30' stroke='%23fff' stroke-width='6'/%3E%3Cpath d='M0,0 L60,30 M60,0 L0,30' clip-path='url(%23t)' stroke='%23C8102E' stroke-width='4'/%3E%3Cpath d='M30,0 v30 M0,15 h60' stroke='%23fff' stroke-width='10'/%3E%3Cpath d='M30,0 v30 M0,15 h60' stroke='%23C8102E' stroke-width='6'/%3E%3C/svg%3E" />
<style>
  :root{--bg-0:#07090c;--bg-1:#0d1117;--ink:#e8edf4;--ink-dim:#9aa6b8;--ink-faint:#5f6b7d;--accent:#ff8a1f;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--sans:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;}
  html,body{margin:0;padding:0;background:var(--bg-0);color:var(--ink);font-family:var(--sans);min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center}
  body{background:radial-gradient(900px 500px at 50% 0%,rgba(255,138,31,.08),transparent 60%),var(--bg-0);padding:24px}
  .card{max-width:520px}
  h1{font-family:var(--mono);font-size:clamp(56px,12vw,120px);margin:0;letter-spacing:-.04em;line-height:1;color:var(--accent)}
  .label{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-faint);margin-top:14px}
  .verdict{font-family:var(--mono);font-size:clamp(20px,4vw,30px);margin:18px 0 8px;letter-spacing:-.01em}
  p{color:var(--ink-dim);font-size:15px;line-height:1.7;margin:6px 0 22px}
  a.btn{display:inline-block;padding:11px 22px;background:var(--accent);color:#0a0d12;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;text-decoration:none;border-radius:999px}
  a.btn:hover{filter:brightness(1.1)}
  .small{margin-top:24px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint)}
  .small a{color:var(--ink-dim);text-decoration:none;margin:0 6px}
  .small a:hover{color:var(--accent)}
</style>
</head>
<body>
<div class="card">
  <h1>404</h1>
  <div class="label">Page not found</div>
  <div class="verdict">Wrong end of the high street.</div>
  <p>That URL isn't on the gauge. Either the chippy moved, or the postman's had a few. Have a brew and head back to the dashboard.</p>
  <a class="btn" href="/">📊 Back to Dashboard</a>
  <div class="small">
    <a href="/">Dashboard</a> ·
    <a href="/news.html">News</a> ·
    <a href="/legal.html">Legal</a>
  </div>
</div>
</body>
</html>
